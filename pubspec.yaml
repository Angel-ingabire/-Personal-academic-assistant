name: personal_academic_assistant
description: A personal academic assistant app with dashboard, assignments, schedule, and attendance tracking.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.19.0

  # State management (simple, suitable for this project skeleton)
  provider: ^6.1.2

  # Local storage options (teams can choose which to use)
  shared_preferences: ^2.3.2
  sqflite: ^2.4.0
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
